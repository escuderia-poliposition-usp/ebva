scan_filter:
  ros__parameters:
    input_topic: /scan
    output_topic: /escuderia/scan
    use_sim_time: false
static_transform:
  child: laser
  parent: zed_left_camera_frame
  pitch: 0.0
  roll: 0.0
  x: 0.0
  y: 0.0
  yaw: 0.0
  z: 0.0
urg_node:
  ros__parameters:
    angle_max: 3.14
    angle_min: -3.14
    calibrate_time: false
    cluster: 1
    default_user_latency: 0.0
    diagnostics_tolerance: 0.05
    diagnostics_window_time: 5.0
    error_limit: 4
    get_detailed_status: false
    ip_address: 192.168.0.10
    ip_port: 10940
    laser_frame_id: laser
    publish_intensity: false
    publish_multiecho: false
    serial_baud: 115200
    skip: 3
    use_sim_time: false
