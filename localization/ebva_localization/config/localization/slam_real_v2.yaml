slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    #scan_topic: /scan
    scan_topic: /escuderia/scan


    mode: mapping #localization   # or mapping on first time

    map_start_at_dock: true
    debug_logging: true
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 5.0
    resolution: 0.05
    max_laser_range: 10.0
    minimum_time_interval: 0.5
    transform_timeout: 1.0
    tf_buffer_duration: 30.0

    use_scan_matching: true
    use_scan_barycenter: true

    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.15

    publish_period: 0.5

    #Force slam_toolbox using Odometry+IMU through /tf
    #use_odometry: false
    #use_imu: false

    use_pose_extrapolation: false

    loop_closure: true
    loop_search_max_distance: 5.0



