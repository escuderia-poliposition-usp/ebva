version: 2
output_root: ~/rosbags
session_prefix: faixas
duration_s: 60.0
discovery_timeout_s: 5.0
min_free_mib: 2048
max_bag_size: 1073741824
max_cache_size: 104857600
interval_s: 1.0
topics:
- /zed/zed_node/rgb/color/rect/image
- /lane_detection/lane_boundaries
- /lane_detection/birdseye_debug
process_patterns:
- zed
- lane_detection_node
- rosbag2
- ros2 bag record
- resource_monitor
- vesc
- ekf_node
- slam_toolbox
- autodrive2vehicle
- urg_node
- joy
- ackermann_mux
