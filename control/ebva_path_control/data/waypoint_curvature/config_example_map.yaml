# metadata
run_name: 'map_wide'
# characteristic number for map
perf_num: 6

# map paths
#map_path: './example_map'
map_path: 'pista1_inova'

map_ext: '.png'

# starting pose for map
sx: -5.4
sy: -3.97
stheta: 0

# raceline path and indices
#wpt_path: './example_waypoints.csv'
wpt_path: 'center.csv'
wpt_delim: ','
wpt_rowskip: 0
wpt_xind: 0
wpt_yind: 1
wpt_thind: 3
wpt_vind: 5

# varied params bound
# physical params
mass_min: 3.0
mass_max: 4.0
lf_min: 0.147
lf_max: 0.170
# controller params
tlad_min: 0.2
tlad_max: 1.
vgain_min: 0.5
vgain_max: 1.0

# computation budget (can think of it as gen_num times pop_size)
popsize: 100
budget: 1000

# optimization method
optim_method: 'CMA'

# seed
seed: 12345
